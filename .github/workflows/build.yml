name: Android APK 빌드

# main(또는 master) 브랜치에 push 하면 자동으로 빌드한다.
# GitHub 저장소의 Actions 탭에서 "Run workflow" 버튼으로 직접 돌릴 수도 있다.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write   # 빌드한 APK 를 Releases 에 올리기 위해 필요

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 소스 내려받기
        uses: actions/checkout@v7

      - name: JDK 17 설치
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 설치
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic

      - name: APK 빌드
        run: >
          gradle assembleRelease --no-daemon --stacktrace
          -PappVersionCode=${{ github.run_number }}
          -PappVersionName=1.0.${{ github.run_number }}

      - name: APK 파일 이름 정리
        run: cp app/build/outputs/apk/release/app-release.apk nana-stock.apk

      - name: APK 를 빌드 결과물(Artifacts)로 올리기
        uses: actions/upload-artifact@v7
        with:
          name: nana-stock-apk
          path: nana-stock.apk
          if-no-files-found: error

      # Releases 에 "최신 APK" 하나만 유지한다. 폰 브라우저에서 바로 내려받을 수 있다.
      - name: Releases 에 최신 APK 올리기
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest-apk --cleanup-tag --yes 2>/dev/null || true
          gh release create latest-apk nana-stock.apk \
            --target "$GITHUB_SHA" \
            --title "나나컴퍼니 앱 1.0.${{ github.run_number }}" \
            --notes "GitHub Actions 가 자동으로 빌드한 최신 APK 입니다. 아래 nana-stock.apk 를 폰에서 내려받아 설치하세요."
